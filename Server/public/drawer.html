<!DOCTYPE html>
<html>
<head>
    <title>Draw Node</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background: #fff; }
        canvas { display: block; cursor: crosshair; }
        
        .controls-overlay {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(240, 240, 240, 0.95);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(5px);
        }

        .header-info { margin: 0; font-family: monospace; font-size: 16px; font-weight: bold; color: #333; display: flex; align-items: center; gap: 15px;}
        
        /* Layout for the color presets */
        .preset-container {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
        }

        /* Styling the nice little squares */
        .color-square {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 2px solid #ccc;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
            box-sizing: border-box;
        }

        .color-square:hover {
            transform: scale(1.15);
            border-color: #333;
        }

        .action-row { display: flex; gap: 10px; align-items: center; }
        
        input[type="text"] { 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            width: 250px;
            font-family: monospace;
        }

        input[type="color"] {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #ccc; border-radius: 50%; }
        input[type="color"]::-moz-color-swatch { border: 2px solid #ccc; border-radius: 50%; }
        
        .btn { 
            padding: 10px 20px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.2s;
        }
        
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    
    <canvas id="drawCanvas"></canvas>
    
    <div class="controls-overlay">
        <div class="header-info">
            <span>Device: <span id="my-device-id"></span> | Node: <span id="my-id"></span></span>
            <input type="color" id="brush-color" value="#000000" title="Custom color picker">
        </div>
        
        <!-- Preset Color Squares -->
        <div class="preset-container">
            <div class="color-square" style="background: #000000;" data-color="#000000"></div>
            <div class="color-square" style="background: #ef4444;" data-color="#ef4444"></div>
            <div class="color-square" style="background: #f97316;" data-color="#f97316"></div>
            <div class="color-square" style="background: #eab308;" data-color="#eab308"></div>
            <div class="color-square" style="background: #22c55e;" data-color="#22c55e"></div>
            <div class="color-square" style="background: #3b82f6;" data-color="#3b82f6"></div>
            <div class="color-square" style="background: #a855f7;" data-color="#a855f7"></div>
            <div class="color-square" style="background: #ffffff;" data-color="#ffffff"></div> <!-- Eraser/White -->
        </div>

        <div class="action-row">
            <input type="text" id="target-id" placeholder="IDs (e.g. node_1, node_2)">
            <button id="connect-btn" class="btn">Connect Nodes</button>
        </div>
        <div class="action-row">
            <button id="new-node-btn" class="btn" style="background-color: #10b981;">New Node</button>
            <button id="switch-node-btn" class="btn" style="background-color: #8b5cf6;">Switch Node</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const drawCanvas = document.getElementById('drawCanvas');
        const ctx = drawCanvas.getContext('2d');
        const colorPicker = document.getElementById('brush-color');
        const colorSquares = document.querySelectorAll('.color-square');
        
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Device ID that can be configured at the start of the script
        const DEVICE_ID = prompt("Enter Device ID:", "Device_" + Math.floor(Math.random() * 1000)) || "Device_" + Math.floor(Math.random() * 1000);
        
        // Node numbers go up sequentially starting from 0
        let nodeCounter = 0;

        // Store multiple nodes for this device
        let myNodes = [];
        let currentNodeIndex = -1;

        // Listen for custom events broadcasted from the Python script
        socket.on('python_update', (data) => {
            console.log("Received command from Python:", data);
            if (data.action === 'change_color' && data.color) {
                ctx.strokeStyle = data.color;
                colorPicker.value = data.color;
            }
        });

        function createNewNode() {
            const newNodeId = DEVICE_ID + '_node_' + nodeCounter++;
            const newNode = {
                id: newNodeId,
                deviceId: DEVICE_ID,
                image: 'data:,' // empty image initially
            };
            myNodes.push(newNode);
            currentNodeIndex = myNodes.length - 1;
            
            document.getElementById('my-device-id').innerText = DEVICE_ID;
            document.getElementById('my-id').innerText = newNodeId;
            
            ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            
            socket.emit('add_node', {
                id: newNodeId,
                deviceId: DEVICE_ID,
                x: Math.random() * 400 + 100,
                y: Math.random() * 400 + 100,
                image: drawCanvas.toDataURL()
            });
        }

        function switchNode() {
            if (myNodes.length <= 1) return;
            
            // Save current canvas to current node before switching
            myNodes[currentNodeIndex].image = drawCanvas.toDataURL();
            
            // Cycle index
            currentNodeIndex = (currentNodeIndex + 1) % myNodes.length;
            const activeNode = myNodes[currentNodeIndex];
            
            document.getElementById('my-id').innerText = activeNode.id;
            
            // Load saved image
            ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            if (activeNode.image && activeNode.image !== 'data:,') {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = activeNode.image;
            }
            // Update stroke style in case it was lost during clear
            ctx.strokeStyle = colorPicker.value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 4;
        }

        function resizeCanvas() {
            const currentImg = drawCanvas.toDataURL();
            drawCanvas.width = window.innerWidth;
            drawCanvas.height = window.innerHeight;
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 4;
            ctx.strokeStyle = colorPicker.value; 
            
            if(currentImg !== 'data:,') {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = currentImg;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); 

        // Update brush from the main color picker
        colorPicker.addEventListener('input', (e) => {
            ctx.strokeStyle = e.target.value;
        });

        // Update brush from the preset squares
        colorSquares.forEach(square => {
            square.addEventListener('click', (e) => {
                const selectedColor = e.target.getAttribute('data-color');
                ctx.strokeStyle = selectedColor; // Change brush color
                colorPicker.value = selectedColor; // Sync the circular picker UI to match
            });
        });

        // Initialize the first node
        createNewNode();

        drawCanvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            lastX = e.offsetX;
            lastY = e.offsetY;
        });
        
        drawCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            
            lastX = e.offsetX;
            lastY = e.offsetY;
            
            const currentImg = drawCanvas.toDataURL();
            myNodes[currentNodeIndex].image = currentImg;
            socket.emit('update_node', { id: myNodes[currentNodeIndex].id, image: currentImg });
        });

        drawCanvas.addEventListener('mouseup', () => isDrawing = false);
        drawCanvas.addEventListener('mouseout', () => isDrawing = false);

        // Touch support
        function getTouchPos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: evt.touches[0].clientX - rect.left,
                y: evt.touches[0].clientY - rect.top
            };
        }

        drawCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            const pos = getTouchPos(drawCanvas, e);
            lastX = pos.x;
            lastY = pos.y;
        }, { passive: false });
        
        drawCanvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            
            const pos = getTouchPos(drawCanvas, e);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            
            lastX = pos.x;
            lastY = pos.y;
            
            const currentImg = drawCanvas.toDataURL();
            myNodes[currentNodeIndex].image = currentImg;
            socket.emit('update_node', { id: myNodes[currentNodeIndex].id, image: currentImg });
        }, { passive: false });

        drawCanvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isDrawing = false;
        });

        drawCanvas.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            isDrawing = false;
        });

        document.getElementById('connect-btn').addEventListener('click', () => {
            const rawInput = document.getElementById('target-id').value;
            if(rawInput && currentNodeIndex >= 0) {
                const myNodeId = myNodes[currentNodeIndex].id;
                const targets = rawInput.split(',').map(id => id.trim()).filter(id => id !== '');
                targets.forEach(targetId => {
                    socket.emit('add_edge', { source: myNodeId, target: targetId });
                });
                document.getElementById('target-id').value = ''; 
            }
        });

        document.getElementById('new-node-btn').addEventListener('click', createNewNode);
        document.getElementById('switch-node-btn').addEventListener('click', switchNode);
    </script>
</body>
</html>
